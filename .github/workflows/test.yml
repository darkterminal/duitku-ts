name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

      - name: Type check
        run: bun run typecheck

  test:
    name: Test (${{ matrix.runtime }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: node
            version: '20'
          - runtime: node
            version: '22'
          - runtime: node
            version: '24'
          - runtime: bun
            version: latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.version }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests (Node.js)
        if: matrix.runtime == 'node'
        run: npm run test:node

      - name: Run tests (Bun)
        if: matrix.runtime == 'bun'
        run: bun run test

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run tests with coverage
        run: bun run test:coverage

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Verify build output
        run: |
          test -f dist/index.js || exit 1
          test -f dist/index.cjs || exit 1
          test -f dist/index.d.ts || exit 1
          echo "✅ All build outputs verified"

      - name: Verify CJS import
        run: |
          node -e "
            const { Config, Api, Pop, VERSION } = require('./dist/index.cjs');
            console.log('CJS VERSION:', VERSION);
            if (typeof Config !== 'function') throw new Error('Config not exported');
            if (typeof Api !== 'function') throw new Error('Api not exported');
            if (typeof Pop !== 'function') throw new Error('Pop not exported');
            console.log('✅ CJS imports verified');
          "

      - name: Verify ESM import
        run: |
          node --input-type=module -e "
            import { Config, Api, Pop, VERSION } from './dist/index.js';
            console.log('ESM VERSION:', VERSION);
            if (typeof Config !== 'function') throw new Error('Config not exported');
            if (typeof Api !== 'function') throw new Error('Api not exported');
            if (typeof Pop !== 'function') throw new Error('Pop not exported');
            console.log('✅ ESM imports verified');
          "
