name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - runtime: node
            version: '18'
          - runtime: node
            version: '20'
          - runtime: node
            version: '22'
          - runtime: bun
            version: latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.version }}
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: ${{ matrix.runtime == 'bun' && 'bun run test' || 'npm test' }}
