name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

  test:
    name: Test (${{ matrix.runtime }} ${{ matrix.version }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          # Node.js LTS versions
          - runtime: node
            version: '18'
          - runtime: node
            version: '22'
          - runtime: node
            version: '24'
          # Bun latest
          - runtime: bun
            version: latest

    steps:
      - uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js ${{ matrix.version }}
        if: matrix.runtime == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
          cache: 'npm'

      # Setup Bun
      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.version }}

      - name: Install dependencies
        run: npm ci

      # Test dengan Vitest (Node.js)
      - name: Run tests (Node.js)
        if: matrix.runtime == 'node'
        run: npm run test

      # Test dengan Vitest via Bun
      - name: Run tests (Bun)
        if: matrix.runtime == 'bun'
        run: bun run test

  coverage:
    name: Test Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      # Upload coverage ke Codecov (opsional)
      # Uncomment jika ingin menggunakan Codecov
      # - name: Upload coverage to Codecov
      #   uses: codecov/codecov-action@v4
      #   with:
      #     files: ./coverage/coverage-final.json
      #     flags: unittests
      #     fail_ci_if_error: false

  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.js || exit 1
          test -f dist/index.cjs || exit 1
          test -f dist/index.d.ts || exit 1
          echo "✅ All build outputs verified"

      - name: Verify CJS import
        run: |
          node -e "
            const { Config, Api, Pop, VERSION } = require('./dist/index.cjs');
            console.log('CJS VERSION:', VERSION);
            if (typeof Config !== 'function') throw new Error('Config not exported');
            if (typeof Api !== 'function') throw new Error('Api not exported');
            if (typeof Pop !== 'function') throw new Error('Pop not exported');
            console.log('✅ CJS imports verified');
          "

      - name: Verify ESM import
        run: |
          node --input-type=module -e "
            import { Config, Api, Pop, VERSION } from './dist/index.js';
            console.log('ESM VERSION:', VERSION);
            if (typeof Config !== 'function') throw new Error('Config not exported');
            if (typeof Api !== 'function') throw new Error('Api not exported');
            if (typeof Pop !== 'function') throw new Error('Pop not exported');
            console.log('✅ ESM imports verified');
          "
