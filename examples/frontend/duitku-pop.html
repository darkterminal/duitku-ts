<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Duitku Pop - Frontend Integration</title>

  <!-- Bootstrap CSS -->
  <link href="https://getbootstrap.com/docs/4.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Duitku JS Bundle (Sandbox) -->
  <!-- Ganti dengan https://app-prod.duitku.com/lib/js/duitku.js untuk production -->
  <script src="https://app-sandbox.duitku.com/lib/js/duitku.js"></script>

  <!-- jQuery -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.1.1/jquery.min.js"></script>
</head>

<body>
  <div class="col-md-6 col-lg-4 offset-lg-4 offset-md-3 mt-5">
    <div class="bg-light p-4 border shadow">
      <form>
        <center>
          <h4>Duitku Pop</h4>
        </center>
        <br>

        <div class="mb-2">
          <label>Amount</label>
          <input required id="amount" min="1" value="10000" type="number" class="form-control" placeholder="10000">
        </div>

        <div class="mb-2">
          <label>Product Detail</label>
          <input required id="productDetail" value="Sepatu Trendy" type="text" class="form-control" placeholder="Sepatu Trendy">
        </div>

        <div class="mb-2">
          <label>Email</label>
          <input required id="email" value="customer@duitku.com" type="text" class="form-control" placeholder="customer@duitku.com">
        </div>

        <div class="mb-2">
          <label>Phone Number</label>
          <input required id="phoneNumber" value="08123456789" type="number" class="form-control" placeholder="08123456789">
        </div>

        <div class="mb-2">
          <label>Payment Interface</label>
          <select id="paymentUi" class="form-control">
            <option value="1">PopUp UI</option>
            <option value="2">Redirect UI</option>
          </select>
        </div>

        <button type="button" id="submit" class="btn btn-primary w-100 my-2 shadow" onClick="payment();">Purchase</button>
      </form>
    </div>
  </div>

  <script type="text/javascript">
    function payment() {
      var amount = document.getElementById("amount").value;
      var productDetail = document.getElementById("productDetail").value;
      var email = document.getElementById("email").value;
      var phoneNumber = document.getElementById("phoneNumber").value;
      var paymentUi = document.getElementById("paymentUi").value;

      $.ajax({
        type: "POST",
        data: {
          // paymentMethod: '', // opsional
          paymentAmount: amount,
          productDetail: productDetail,
          email: email,
          phoneNumber: phoneNumber
        },
        url: 'http://localhost:3011/create-invoice', // Sesuaikan dengan endpoint backend Anda
        dataType: "json",
        cache: false,
        success: function(result) {
          console.log('Reference:', result.reference);
          console.log('Response:', result);

          if (paymentUi === "2") {
            // Redirect UI
            window.location = result.paymentUrl;
            return;
          }

          // PopUp UI
          checkout.process(result.reference, {
            successEvent: function(result) {
              console.log('success');
              console.log(result);
              alert('Payment Success');
            },
            pendingEvent: function(result) {
              console.log('pending');
              console.log(result);
              alert('Payment Pending');
            },
            errorEvent: function(result) {
              console.log('error');
              console.log(result);
              alert('Payment Error');
            },
            closeEvent: function(result) {
              console.log('customer closed the popup without finishing the payment');
              console.log(result);
              alert('Customer closed the popup without finishing the payment');
            }
          });
        },
        error: function(xhr, status, error) {
          console.error('AJAX Error:', status, error);
          alert('Error: ' + error);
        }
      });
    }
  </script>
</body>

</html>
